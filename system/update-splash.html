<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Updating</title>
<style>
  html,body{height:100%;margin:0;background:#0d0f12;color:#e8eaed;
    font-family:system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center}
  .wrap{width:78%;max-width:560px;text-align:center}
  h1{font-size:1.5rem;font-weight:600;margin:0 0 .4rem}
  p.sub{color:#9aa0a6;margin:0 0 2rem;font-size:.95rem}
  .bar{height:10px;background:#2a2e35;border-radius:5px;overflow:hidden}
  .fill{height:100%;width:0%;background:#4c8bf5;border-radius:5px;
    transition:width .6s ease;position:relative;overflow:hidden}
  .fill::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    animation:shimmer 1.6s infinite}
  @keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .msg{margin-top:1rem;color:#9aa0a6;font-size:.95rem;min-height:1.4em}
  .warn{margin-top:2.2rem;color:#5f6368;font-size:.8rem;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>Updating panel software</h1>
  <p class="sub">This happens automatically overnight</p>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="msg" id="msg">Starting…</div>
  <div class="warn">Do not switch off the panel — it returns to the dashboard
    automatically<br>(and may restart once during the update)</div>
</div>
<script>
// Poll the status file written by update.sh. fetch() is blocked between
// file:// URLs, but <script src> execution is not — the status file is a
// tiny JS snippet assigning window.updateStatus (JSONP style). The query
// string busts chromium's cache each second.
function poll(){
  var s=document.createElement('script');
  s.src='file:///run/ha-panel-update-status.js?ts='+Date.now();
  s.onload=s.onerror=function(){
    if(window.updateStatus){
      document.getElementById('fill').style.width=(window.updateStatus.pct||0)+'%';
      document.getElementById('msg').textContent=window.updateStatus.message||'';
    }
    s.remove();
  };
  document.body.appendChild(s);
}
poll();
setInterval(poll,1000);
</script>
</body>
</html>
